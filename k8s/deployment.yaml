apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
      - name: inventory-api
        image: 295856123682.dkr.ecr.us-east-1.amazonaws.com/inventory-api:3.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
