name: Inventory API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  security-and-test:
    name: Security and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm Audit
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        run: npm test

  container-security:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    needs: security-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t inventory-api-v2:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-api-v2:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-api-v2:${{ github.sha }}
          format: cyclonedx
          output: sbom.json
          scan-type: image

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api-sbom
          path: sbom.json
